apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - { name: tre, namespace: kube-system }
  rules:
    - matches:
        - path: { type: PathPrefix, value: /auth }
      backendRefs:
        - { name: keycloak, port: 80 }
