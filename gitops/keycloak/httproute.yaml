apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: tre, namespace: kube-system }
  rules:
    - matches:
        - path: { type: PathPrefix, value: /auth }
      backendRefs:
        - { group: "", kind: Service, name: keycloak, port: 80, weight: 1 }
