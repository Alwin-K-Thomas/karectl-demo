apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - admin-redirect.yaml

configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-tre.json

generatorOptions:
  disableNameSuffixHash: true
