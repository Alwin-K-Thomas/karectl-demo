apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jupyterhub
  namespace: jupyterhub
spec:
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: tre, namespace: kube-system }
  rules:
    - matches:
        - path: { type: PathPrefix, value: /jupyter }
      backendRefs:
        - { group: "", kind: Service, name: proxy-public, port: 80, weight: 1 }
